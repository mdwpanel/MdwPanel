kind = "web"
previewPath = "/"
title = "MDW Panel"
version = "1.0.0"
id = "artifacts/mdw-panel"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23145

[services.development]
run = "pnpm --filter @workspace/mdw-panel run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mdw-panel", "run", "build" ]
publicDir = "artifacts/mdw-panel/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23145"
BASE_PATH = "/"
