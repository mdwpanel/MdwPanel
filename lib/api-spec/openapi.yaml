openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: MDW Panel API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: keys
    description: License key management
  - name: users
    description: User management
  - name: games
    description: Game management
  - name: stats
    description: Dashboard statistics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Username or email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout current session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /keys:
    get:
      operationId: listKeys
      tags: [keys]
      summary: List all license keys (admin)
      parameters:
        - name: game
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [active, expired, banned]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of keys
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyListResponse"
    post:
      operationId: createKey
      tags: [keys]
      summary: Generate a new license key (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeyInput"
      responses:
        "201":
          description: Key created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicenseKey"

  /keys/{id}:
    get:
      operationId: getKey
      tags: [keys]
      summary: Get a specific license key
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: License key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicenseKey"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateKey
      tags: [keys]
      summary: Update a license key (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeyUpdate"
      responses:
        "200":
          description: Updated key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicenseKey"
    delete:
      operationId: deleteKey
      tags: [keys]
      summary: Delete a license key (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /keys/bulk:
    post:
      operationId: bulkCreateKeys
      tags: [keys]
      summary: Generate multiple license keys at once (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkKeyInput"
      responses:
        "201":
          description: Keys created
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LicenseKey"

  /keys/my:
    get:
      operationId: getMyKeys
      tags: [keys]
      summary: Get keys for the logged-in user
      responses:
        "200":
          description: User's keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LicenseKey"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (admin)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Users list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a specific user (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /games:
    get:
      operationId: listGames
      tags: [games]
      summary: List all supported games
      responses:
        "200":
          description: Games list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Game"
    post:
      operationId: createGame
      tags: [games]
      summary: Create a new game (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameInput"
      responses:
        "201":
          description: Game created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"

  /games/{id}:
    patch:
      operationId: updateGame
      tags: [games]
      summary: Update a game (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameUpdate"
      responses:
        "200":
          description: Updated game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
    delete:
      operationId: deleteGame
      tags: [games]
      summary: Delete a game (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /stats/dashboard:
    get:
      operationId: getDashboardStats
      tags: [stats]
      summary: Get dashboard statistics overview
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /stats/activity:
    get:
      operationId: getRecentActivity
      tags: [stats]
      summary: Get recent login/connect activity feed
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Activity feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityLog"

  /chat/messages:
    get:
      operationId: getChatMessages
      tags: [chat]
      summary: Get recent chat messages
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Chat messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessage"
    post:
      operationId: sendChatMessage
      tags: [chat]
      summary: Send a chat message
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageInput"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"
        "400":
          description: Invalid input

  /settings/invite-code:
    get:
      operationId: getInviteCode
      tags: [settings]
      summary: Get current invite code (admin only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current invite code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteCodeResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
    put:
      operationId: updateInviteCode
      tags: [settings]
      summary: Update invite code (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteCodeInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteCodeResponse"
        "400":
          description: Invalid input
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    SuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        message:
          type: ["string", "null"]

    RegisterInput:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          minLength: 3
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        inviteCode:
          type: string

    ChatMessage:
      type: object
      required: [id, userId, username, message, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        username:
          type: string
        message:
          type: string
        createdAt:
          type: string
          format: date-time

    SendMessageInput:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 500

    InviteCodeResponse:
      type: object
      required: [code]
      properties:
        code:
          type: string

    InviteCodeInput:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 1

    LoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      required: [user, token]
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string

    User:
      type: object
      required: [id, username, email, role, createdAt]
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, user]
        banned:
          type: boolean
        createdAt:
          type: string
          format: date-time

    UserUpdate:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, user]
        banned:
          type: boolean
        password:
          type: string

    UserListResponse:
      type: object
      required: [users, total, page, limit]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    LicenseKey:
      type: object
      required: [id, key, game, status, duration, createdAt]
      properties:
        id:
          type: integer
        key:
          type: string
        game:
          type: string
        status:
          type: string
          enum: [active, expired, banned]
        duration:
          type: integer
          description: Duration in days
        note:
          type: ["string", "null"]
        hwid:
          type: ["string", "null"]
        lastUsedAt:
          type: ["string", "null"]
        expiresAt:
          type: ["string", "null"]
        userId:
          type: ["integer", "null"]
        username:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    KeyInput:
      type: object
      required: [game, duration]
      properties:
        game:
          type: string
        duration:
          type: integer
        note:
          type: string
        userId:
          type: ["integer", "null"]

    KeyUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [active, expired, banned]
        note:
          type: string
        duration:
          type: integer
        userId:
          type: ["integer", "null"]
        hwid:
          type: ["string", "null"]

    BulkKeyInput:
      type: object
      required: [game, duration, count]
      properties:
        game:
          type: string
        duration:
          type: integer
        count:
          type: integer
          minimum: 1
          maximum: 100
        note:
          type: string

    KeyListResponse:
      type: object
      required: [keys, total, page, limit]
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/LicenseKey"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    Game:
      type: object
      required: [id, name, slug, status, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        status:
          type: string
          enum: [active, maintenance, disabled]
        version:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    GameInput:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
        slug:
          type: string
        version:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [active, maintenance, disabled]

    GameUpdate:
      type: object
      properties:
        name:
          type: string
        version:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [active, maintenance, disabled]

    DashboardStats:
      type: object
      required: [totalKeys, activeKeys, expiredKeys, bannedKeys, totalUsers, totalGames, todayConnects, recentConnects]
      properties:
        totalKeys:
          type: integer
        activeKeys:
          type: integer
        expiredKeys:
          type: integer
        bannedKeys:
          type: integer
        totalUsers:
          type: integer
        totalGames:
          type: integer
        todayConnects:
          type: integer
        recentConnects:
          type: integer

    ActivityLog:
      type: object
      required: [id, action, key, game, success, createdAt]
      properties:
        id:
          type: integer
        action:
          type: string
        key:
          type: string
        game:
          type: string
        success:
          type: boolean
        ipAddress:
          type: ["string", "null"]
        hwid:
          type: ["string", "null"]
        reason:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
